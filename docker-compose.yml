services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    
  firebase-emulator:
    build: ./emulator
    ports:
      - "9099:9099"
      - "9000:9000"

  backend:
    build: ./backend
    depends_on:
      - firebase-emulator
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      FIREBASE_DATABASE_EMULATOR_HOST: firebase-emulator:9000
    expose:
      - "5000"
    deploy:
      replicas: 2

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5000:8080"