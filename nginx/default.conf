limit_req_zone $binary_remote_addr zone=cadastro:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=geral:10m rate=20r/s;

upstream backend_pool {
    server backend:5000 max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    limit_req_status 429;

    location = /metrics {
        return 404;
    }

    location = /users/create {
        limit_req zone=cadastro burst=3 nodelay;
        proxy_pass http://backend_pool;
    }

    location / {
        limit_req zone=geral burst=40 nodelay;
        proxy_pass http://backend_pool;
    }
}